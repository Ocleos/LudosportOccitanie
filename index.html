<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!--
      title, meta description, canonical, og:title/og:description/og:url and twitter:title/twitter:description are
      set per-route by TanStack Router's `head` route option (see src/utils/seo.utils.ts and each src/routes/*.tsx file)
      and rendered via `HeadContent` in src/routes/__root.tsx, so only the tags that stay identical across every
      route are hardcoded here.
    -->
    <meta
      content="sabre laser, combat sportif, Ludosport Occitanie, cours d'essai, sabre laser Montpellier, sabre laser Nîmes"
      name="keywords"
    />
    <meta content="index, follow" name="robots" />
    <meta content="#0f172a" name="theme-color" />
    <meta content="website" property="og:type" />
    <meta content="fr_FR" property="og:locale" />
    <meta content="Ludosport Occitanie" property="og:site_name" />
    <meta content="https://www.ludosport-occitanie.fr/og-image.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="https://www.ludosport-occitanie.fr/og-image.png" name="twitter:image" />
    <link href="/logo.svg" rel="icon" type="image/svg+xml" />
    <link href="/favicon.ico" rel="icon" sizes="48x48" />
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <link href="/manifest.json" rel="manifest" />
    <link href="/src/index.css" rel="stylesheet" />
    <!--
      Fallback only: React 19 hoists a route's own <title> before this one once it mounts (so it always wins,
      including for crawlers that render JS), but this keeps a correct title for the very first paint and for
      clients that never execute JS.
    -->
    <title>Ludosport Occitanie - Combat sportif au sabre laser</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      This block is allow-listed in vercel.json's Content-Security-Policy via a sha256 hash (no 'unsafe-inline').
      If you edit the JSON below, recompute the hash and update the script-src directive in vercel.json:
      python3 -c "import re,hashlib,base64; s=re.search(r'ld\+json\">(.*?)</script>', open('index.html').read(), re.S)[1]; print('sha256-' + base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsOrganization",
        "name": "Ludosport Occitanie",
        "url": "https://www.ludosport-occitanie.fr/",
        "description": "Association sportive proposant du combat sportif au sabre laser en Occitanie.",
        "sport": "Laser sword combat",
        "areaServed": ["Montpellier", "Nîmes", "Occitanie"],
        "sameAs": [
          "https://www.facebook.com/ludosportoccitanie/",
          "https://www.instagram.com/ludosport.occitanie/"
        ]
      }
    </script>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
